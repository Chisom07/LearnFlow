<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LearnFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="site-nav" aria-label="Primary"></nav>

<main class="container auth-shell">
  <div class="auth-box">
    <h2>Create your account</h2>
    <p class="auth-sub">Join LearnFlow as a student or instructor.</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required>

      <label for="role">I am a</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
      </select>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <p style="margin-top:18px;">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <div id="message"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
