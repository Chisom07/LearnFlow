<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | LearnFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="site-nav" aria-label="Primary"></nav>

<main class="container">
  <header class="page-header">
    <h1>Course catalogue</h1>
    <p>Search by topic or filter by category to find the right course.</p>
  </header>

  <div class="course-filters">
    <input
      type="search"
      id="search"
      placeholder="Search courses..."
    >
    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
  </div>

  <div id="coursesContainer" class="grid"></div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/courses.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
