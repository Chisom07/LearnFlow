<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="site-nav" aria-label="Primary"></nav>

<div class="container">

  <header class="page-header">
    <h1>Instructor dashboard</h1>
    <p>Manage courses, lessons, and quizzes for your learners.</p>
  </header>

  <div id="stats"></div>

  <br><br>

  <section id="courseManager" class="management-panel" hidden>
    <div class="management-header">
      <div>
        <span class="course-category">Course management</span>
        <h2 id="managerTitle">Add content</h2>
        <p id="managerSubtitle"></p>
      </div>
      <button id="closeManager" class="close-panel" type="button" aria-label="Close">
        &times;
      </button>
    </div>

    <div id="managerMessage" class="enrolment-message" aria-live="polite"></div>

    <form id="lessonForm" hidden>
      <div class="form-grid">
        <label>
          Lesson title
          <input type="text" id="lessonTitle" required>
        </label>
        <label>
          YouTube video URL
          <input type="url" id="lessonYoutubeUrl" placeholder="https://youtube.com/watch?v=..." required>
        </label>
      </div>
      <label>
        Description
        <textarea id="lessonDescription" rows="4"></textarea>
      </label>
      <label>
        PDF resource (optional)
        <input type="file" id="lessonPdf" accept=".pdf,application/pdf">
      </label>
      <button class="btn" type="submit">Save Lesson</button>
    </form>

    <form id="quizForm" hidden>
      <label>
        Quiz title
        <input type="text" id="quizTitle" required>
      </label>
      <label>
        First question
        <textarea id="quizQuestion" rows="3" required></textarea>
      </label>
      <label>
        Answer options
        <textarea
          id="quizOptions"
          rows="4"
          placeholder="Enter one option per line"
          required
        ></textarea>
      </label>
      <label>
        Correct answer
        <input
          type="text"
          id="quizCorrectAnswer"
          placeholder="Must exactly match one option"
          required
        >
      </label>
      <button class="btn" type="submit">Create Quiz</button>
    </form>
  </section>

  <section class="create-course-section">
    <div class="section-heading">
      <div>
        <h2>Create Course</h2>
        <p>Add a new course to your catalogue.</p>
      </div>
    </div>

    <div id="courseFormMessage" class="enrolment-message" aria-live="polite"></div>

    <form id="courseForm">
      <input type="text" id="title" placeholder="Course Title" required>
      <textarea id="description" placeholder="Description"></textarea>
      <input type="text" id="category" placeholder="Category">
      <input type="number" id="price" placeholder="Price">
      <input type="file" id="thumbnail">

      <button class="btn" type="submit">
        Create Course
      </button>
    </form>
  </section>

</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/instructor.js"></script>

  <script src="js/footer.js"></script>
</body>
</html>
